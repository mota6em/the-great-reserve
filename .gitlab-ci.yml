image: unityci/editor:2022.3.5f1

stages:
  - test

unit_tests:
  stage: test
  script:
    - echo "Running EditMode tests..."
    - |
      unity-editor -batchmode -nographics -projectPath . \
      -runTests -testPlatform EditMode -logFile test-results.log || true
    - cat test-results.log
  artifacts:
    when: always
    paths:
      - test-results.log
