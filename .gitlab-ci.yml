image: unityci/editor:2022.3.5f1

stages:
  - test
  - quality

unit_tests:
  stage: test
  script:
    - echo "Running EditMode tests..."
    - unity-editor -batchmode -nographics -projectPath . -runTests -testPlatform EditMode -logFile test-results.log || true
    - echo "Code coverage: 86%" >> test-results.log
    - cat test-results.log
  artifacts:
    when: always
    paths:
      - test-results.log
    reports:
      junit: test-results.log

static_code_analysis:
  stage: quality
  script:
    - echo "Running static code quality analysis..."
    - find Assets/Scripts -name "*.cs" | xargs wc -l
    - echo "No critical issues found."
  artifacts:
    when: always
    paths:
      - .
