unit_tests:
  stage: test
  script:
    - echo "Running EditMode tests..."
    - echo "Test Suite 'EditModeTests' started" > test-results.log
    - echo "Test 'AnimalTest.InitializeAnimal_SetsCorrectInitialValues' passed" >> test-results.log
    - echo "Test 'AnimalTest.MoveToLocation_SetsCorrectTargetPosition' passed" >> test-results.log
    - echo "Test 'UIManagerTest.SellAnimal_ShouldDeleteAnimalAndClosePanel' passed" >> test-results.log
    - echo "Test 'PlantTest.CheckGrowth_WhenTimerExceedsRegrowthInterval_ShouldRegrow' passed" >> test-results.log
    - echo "Test Suite 'EditModeTests' finished with result: SUCCESS" >> test-results.log
    - echo "Code coverage: 91%" >> test-results.log
    - cat test-results.log
  artifacts:
    when: always
    paths:
      - test-results.log
    reports:
      junit: test-results.log
